# Copy to config.toml and adjust.

# Emails are selected when their subject OR an attachment's file name contains
# any of these words (case-insensitive, whole words). Add or remove as needed.
keywords = ["Facture", "Facturation", "Invoice"]

# Only keep emails that have an attachment.
require_attachment = true

# Optional extra Gmail search terms appended to the query,
# e.g. '-from:newsletter@example.com' or 'in:inbox'.
extra_query = ""

# Advanced: a full Gmail query that replaces the keyword-based one. Leave empty to use keywords.
query = ""

# Only look at mail newer than this (Gmail "newer_than" syntax: 30d, 6m, 1y). Empty = no limit.
newer_than = "1y"

# Gmail label applied to processed messages (created if missing); labelled mail is skipped
# on later runs. Empty = don't label.
processed_label = "invoices-processed"

# Where attachments and the SQLite register are stored.
data_dir = "data"

# Attachment extensions that are kept.
extensions = [".pdf", ".png", ".jpg", ".jpeg", ".xml"]

# OAuth files (see README).
credentials_file = "credentials.json"
token_file = "token.json"
